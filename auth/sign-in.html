<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Computer Laboratory Inventory System</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/login.css" />
  </head>
  <body class="h-screen d-flex flex-column items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-12" style="width: 100%; max-width: 450px; margin: var(--space-16)">
      <!-- Login Header with Logo -->
      <div class="text-center mb-8">
        <div class="d-flex flex-column items-center justify-center">
          <img class="w-aut h-80" src="../assets/images/logo/britech-logo.png" alt="Britech Logo" />
          <h1 class="text-3xl font-bold text-secondary">BRITECH COLLEGE</h1>
        </div>
        <p class="text-sm text-secondary" style="line-height: 1.8; letter-spacing: 0.3px">
          Computer Laboratory Inventory & Maintenance Monitoring System
        </p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <!-- Username/Email Field -->
        <div class="mb-6">
          <label for="username" class="d-block text-black font-semibold text-sm mb-2">Username / Email</label>
          <input class="input input__login" type="text" name="username" id="username" />
        </div>

        <!-- Password Field -->
        <div class="mb-6">
          <label for="password" class="d-block text-black font-semibold text-sm mb-2">Password</label>
          <input class="input input__login" type="password" name="password" id="password" />
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="d-flex justify-between items-center mb-8" style="gap: var(--space-4); flex-wrap: wrap">
          <div class="d-flex items-center gap-2">
            <input class="checkbox input__checkbox" type="checkbox" id="rememberMe" name="rememberMe" />
            <label for="rememberMe" class="text-black text-sm font-medium" style="margin: 0; cursor: pointer"
              >Remember Me</label
            >
          </div>
          <a
            href="#"
            class="text-secondary text-sm font-semibold"
            style="text-decoration: none; transition: all 0.3s ease"
            >Forgot Password?</a
          >
        </div>

        <!-- Login Button -->
        <button
          type="button"
          class="w-100 bg-primary text-secondary p-3 rounded-sm font-bold text-base shadow-md"
          style="border: none; cursor: pointer; transition: all 0.3s ease"
          onclick="window.location.href = '../pages/dashboard.html'"
        >
          Login
        </button>
      </form>
    </div>
  </body>
</html>
